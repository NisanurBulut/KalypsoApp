<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Kalypso architecture: the MAUI app and the ASP.NET Core API are separate programs that talk over HTTP and share one contracts library">
  <defs>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C724B1"/>
      <stop offset="0.55" stop-color="#FF5E6C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F4B"/>
      <stop offset="0.6" stop-color="#1E6FFF"/>
      <stop offset="1" stop-color="#00D4C8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#12254D"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Verdana, "DejaVu Sans", sans-serif; }
      .zone { font-size: 17px; font-weight: 700; fill: #fff; }
      .sub { font-size: 12px; fill: #fff; fill-opacity: .85; }
      .box { fill: #fff; stroke: none; }
      .name { font-size: 14px; font-weight: 700; fill: #12254D; }
      .note { font-size: 11.5px; fill: #6B7A99; }
    </style>
  </defs>

  <rect width="900" height="470" fill="#FFF4E0"/>

  <!-- ===== Client zone ===== -->
  <rect x="20" y="20" width="360" height="360" rx="24" fill="url(#app)"/>
  <text x="44" y="54" class="zone">Kalypso.Maui</text>
  <text x="44" y="73" class="sub">The app (Android / Windows)</text>

  <rect x="44" y="92" width="312" height="62" rx="14" class="box"/>
  <text x="62" y="118" class="name">Pages (XAML)</text>
  <text x="62" y="138" class="note">Look and feel only. No logic.</text>

  <rect x="44" y="174" width="312" height="62" rx="14" class="box"/>
  <text x="62" y="200" class="name">Platform services</text>
  <text x="62" y="216" class="note">Clipboard, Share, Launcher, Preferences</text>
  <text x="62" y="230" class="note">Android share target</text>

  <rect x="44" y="256" width="312" height="104" rx="14" fill="#FFFFFF" fill-opacity="0.18" stroke="#fff" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="62" y="280" class="zone" font-size="14">Kalypso.Client  (plain .NET, no UI types)</text>
  <rect x="58" y="292" width="140" height="56" rx="10" class="box"/>
  <text x="68" y="314" class="name" font-size="13">ViewModels</text>
  <text x="68" y="333" class="note">MVVM + commands</text>
  <rect x="206" y="292" width="140" height="56" rx="10" class="box"/>
  <text x="216" y="314" class="name" font-size="13">API client</text>
  <text x="216" y="333" class="note">History, QR code</text>

  <!-- ===== Shared contracts ===== -->
  <rect x="396" y="150" width="108" height="150" rx="18" fill="#FFD166"/>
  <text x="450" y="188" text-anchor="middle" class="name">Kalypso</text>
  <text x="450" y="206" text-anchor="middle" class="name">.Contracts</text>
  <text x="450" y="232" text-anchor="middle" class="note">Request and</text>
  <text x="450" y="247" text-anchor="middle" class="note">response records,</text>
  <text x="450" y="262" text-anchor="middle" class="note">validation rules</text>
  <text x="450" y="283" text-anchor="middle" class="note" font-weight="700">shared</text>

  <!-- ===== Server zone ===== -->
  <rect x="520" y="20" width="360" height="360" rx="24" fill="url(#api)"/>
  <text x="544" y="54" class="zone">Kalypso.Api</text>
  <text x="544" y="73" class="sub">The server (ASP.NET Core Minimal API)</text>

  <rect x="544" y="92" width="312" height="62" rx="14" class="box"/>
  <text x="562" y="118" class="name">Endpoints</text>
  <text x="562" y="134" class="note">POST /api/links · GET /api/links/{code}</text>
  <text x="562" y="148" class="note">GET /{code} sends the visitor to the long link</text>

  <rect x="544" y="174" width="312" height="62" rx="14" class="box"/>
  <text x="562" y="200" class="name">Rules and protection</text>
  <text x="562" y="216" class="note">Validation, random codes, rate limiting,</text>
  <text x="562" y="230" class="note">CORS and a health check</text>

  <rect x="544" y="256" width="312" height="104" rx="14" class="box"/>
  <text x="562" y="282" class="name">EF Core  →  SQLite</text>
  <text x="562" y="302" class="note">One table: ShortLink (code, original URL, clicks, date)</text>
  <text x="562" y="322" class="note">The only place where links are stored</text>

  <!-- ===== HTTP arrows ===== -->
  <path d="M200 382 V404 H700 V382" fill="none" stroke="#12254D" stroke-width="2.5" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="352" y="389" width="196" height="30" rx="15" fill="#fff" stroke="#12254D" stroke-width="2"/>
  <text x="450" y="409" text-anchor="middle" class="name" font-size="13">HTTPS + JSON</text>
  <text x="450" y="446" text-anchor="middle" class="note">The only link between the two programs.</text>

  <!-- both sides reference the contracts library (a build-time reference, not a network call) -->
  <path d="M380 225 H396" fill="none" stroke="#12254D" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M520 225 H504" fill="none" stroke="#12254D" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
